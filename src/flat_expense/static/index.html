<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Квартира — расходы и планы</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/editor.css">
  <link rel="stylesheet" href="/assets/overview.css">
  <script src="/assets/app.js" defer></script>
</head>
<body class="app-shell sidebar-collapsed">
  <a class="skip" href="#main">К содержимому</a>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview" aria-label="Квартира — обзор" title="Квартира — обзор"><span class="brand-icon" aria-hidden="true">⌂</span><span class="brand-text">Квартира<span class="brand-sub">Личный учёт</span></span></a>
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Развернуть меню" title="Развернуть меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m5-11 3 3-3 3" class="sidebar-toggle-arrow"/></svg><span class="sidebar-toggle-label">Свернуть меню</span></button>
    <nav aria-label="Разделы">
      <a href="#overview" data-view="overview" aria-label="Обзор" title="Обзор"><span class="nav-icon" aria-hidden="true">◫</span><span class="nav-label">Обзор</span></a>
      <a href="#ledger" data-view="ledger" aria-label="Расходы и планы" title="Расходы и планы"><span class="nav-icon" aria-hidden="true">↗</span><span class="nav-label">Расходы и планы</span></a>
      <a href="#loan" data-view="loan" aria-label="Займ" title="Займ"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-label">Займ</span></a>
      <a href="#categories" data-view="categories" aria-label="Категории" title="Категории"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-label">Категории</span></a>
    </nav>
    <div class="sidebar-bottom"><span class="tiny-label">НАША ЦЕЛЬ</span><strong>Переезд</strong><span>Август 2027</span></div>
  </aside>
  <main id="main" tabindex="-1">
    <header class="page-header">
      <div><p class="eyebrow">РАСХОДЫ НА КВАРТИРУ</p><h1 id="page-title">Обзор</h1><p id="page-subtitle" class="muted">Понимать, сколько уже потрачено и что ещё впереди.</p></div>
      <div class="header-actions"><button class="button secondary" data-action="new-plan">Запланировать</button><button class="button primary" data-action="new-expense"><span aria-hidden="true">＋</span> Записать оплату</button></div>
    </header>
    <div id="global-error" class="notice error hidden" role="alert"></div>
    <div id="loading" class="loading" role="status"><span class="spinner"></span>Загружаю ваш учёт…</div>
    <section id="view-overview" class="view hidden" aria-label="Обзор расходов"></section>
    <section id="view-ledger" class="view hidden" aria-label="Расходы и планы"></section>
    <section id="view-loan" class="view hidden" aria-label="График займа"></section>
    <section id="view-categories" class="view hidden" aria-label="Категории"></section>
    <footer class="page-footer"><span>Квартира · расходы и планы</span><span class="footer-actions"><button class="text-button" data-action="refresh">Обновить список</button><button class="text-button logout-button" data-action="logout">Выйти</button></span></footer>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"><div class="dialog-head"><div><p id="editor-eyebrow" class="eyebrow"></p><h2 id="editor-title"></h2></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="Закрыть">×</button></div><div id="editor-content"></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-head"><h2 id="confirm-title">Подтверждение</h2></div><p id="confirm-text"></p><div class="form-actions"><button class="button secondary" id="confirm-cancel">Отмена</button><button class="button danger" id="confirm-ok">Подтвердить</button></div></dialog>
  <div id="toast" role="status" class="toast hidden"></div>
  <noscript><p>Для ввода расходов включите JavaScript в браузере.</p></noscript>
</body>
</html>
